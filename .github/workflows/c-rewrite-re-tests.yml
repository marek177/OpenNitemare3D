name: C rewrite RE self-test

on:
  push:
    branches:
      - research-c-rewrite-2026-10-02

jobs:
  recovered-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build isolated recovered runtime test
        run: gcc -std=c11 -Wall -Wextra -Werror tests/n3d_re_runtime_test.c n3d_re_runtime.c n3d_re_guard.c n3d_re_collision.c n3d_re_player.c n3d_re_projectile.c n3d_re_combat.c n3d_re_definitions.c n3d_re_door.c n3d_re_special_runtime.c n3d_re_use.c n3d_re_pickup.c n3d_re_trig.c n3d_re_movement.c n3d_re_timing.c n3d_re_controls.c n3d_re_weapon.c n3d_re_save.c n3d_re_img.c n3d_re_wall_explosion.c n3d_re_map_archive.c n3d_re_object_defs.c n3d_re_guard_sounds.c n3d_re_guard_perception.c n3d_re_guard_plan.c n3d_re_guard_move.c -o n3d_re_runtime_test

      - name: Run recovered runtime test
        run: ./n3d_re_runtime_test


  legacy-shell-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install legacy shell headers
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libsdl2-dev \
            libsdl2-mixer-dev \
            libsdl2-image-dev \
            libsdl2-ttf-dev \
            libfluidsynth-dev

      - name: Syntax-check integrated legacy C shell
        run: |
          gcc -std=c11 -Wall -Wextra -fsyntax-only \
            p_think.c \
            g_game.c \
            g_main.c \
            g_think.c \
            m_obj.c \
            $(pkg-config --cflags sdl2 SDL2_mixer SDL2_image SDL2_ttf fluidsynth)

      - name: Link complete C rewrite
        run: |
          mkdir -p build
          gcc -std=c11 -Wall -Wextra \
            *.c \
            -o build/N3D-ci \
            $(pkg-config --cflags --libs sdl2 SDL2_mixer SDL2_image SDL2_ttf fluidsynth) \
            -lm
